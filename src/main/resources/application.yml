spring:
  main:
    web-application-type: reactive
    banner-mode: off
  ai:
    openai:
      base-url: ${spring.ai.openai.base-url:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${spring.ai.openai.api-key:placeholder}
      # DLC uses Spring AI's stateless Responses API model; its endpoint is base-url + /responses.
      # Both properties fall back to the existing setup-wizard keys for compatibility.
      responses:
        base-url: ${SPRING_AI_OPENAI_RESPONSES_BASE_URL:${spring.ai.openai.base-url}}
        model: ${SPRING_AI_OPENAI_RESPONSES_MODEL:${spring.ai.openai.chat.options.model}}
      chat:
        options:
          model: ${spring.ai.openai.chat.options.model:qwen3.8-27b}

server:
  port: ${SERVER_PORT:19869}

dlc:
  workspace: ${DLC_WORKSPACE:.}
  permission-mode: ${DLC_PERMISSION_MODE:STANDARD}
  bash-timeout-seconds: ${DLC_BASH_TIMEOUT:30}
  max-tool-output-chars: ${DLC_MAX_OUTPUT:30000}
  # 模型上下文窗口（tokens）。应与实际模型规格一致，例如 agnes-3.0-flash 为 524288。
  # 该值决定压缩触发点，配小了会导致长任务被频繁压缩。
  context-window-tokens: ${DLC_CONTEXT_WINDOW:524288}
  context-compression-enabled: ${DLC_CONTEXT_COMPRESSION:true}
  vision-enabled: ${DLC_VISION:true}
  # 单次 API 调用最大 completion tokens。agnes-3.0-flash 支持 65536，
  # 8192 会在长任务规划阶段就被截断，故默认 32768（留出余量不顶满）。
  max-completion-tokens: ${DLC_MAX_COMPLETION_TOKENS:32768}
  # 单回合协作式停止上限。0 = 不限制（默认，保持原有行为）。
  # 到达后于下一次迭代边界停止，不会打断正在执行的工具。
  turn:
    max-duration-seconds: ${DLC_TURN_MAX_DURATION:0}
    max-tool-calls: ${DLC_TURN_MAX_TOOL_CALLS:0}
  subagent:
    enabled: ${DLC_SUBAGENT_ENABLED:true}
    max-depth: ${DLC_SUBAGENT_MAX_DEPTH:1}
    max-concurrent: ${DLC_SUBAGENT_MAX_CONCURRENT:4}
    timeout-seconds: ${DLC_SUBAGENT_TIMEOUT:300}
    max-timeout-seconds: ${DLC_SUBAGENT_MAX_TIMEOUT:600}
    max-prompt-chars: ${DLC_SUBAGENT_MAX_PROMPT:32000}
  channels:
    wecom:
      enabled: ${DLC_WECOM_ENABLED:true}
      corp-id: ${DLC_WECOM_CORP_ID:aib_2-vuHukctcQnMNolARdJtd1pHvKig0U}
      secret: ${DLC_WECOM_SECRET:33I7t7nuARdfs9OdfUJexq7f2xWrCvUcLaeQqYqMbrR}

logging:
  level:
    root: ERROR
    com.dlchm.dlc: ERROR
    com.dlchm.dlc.channel.wecom: INFO
    org.springframework: ERROR
